# Cofoundy Portfolio — GitHub Actions Deploy
# Replaces local deploy.sh with push-to-deploy CI/CD.
# Push to main → build → deploy to GitHub Pages. That's it.
#
# Prerequisites (one-time, handled by migrate-to-actions.sh):
#   1. Repo Settings > Pages > Source = "GitHub Actions"
#   2. public/CNAME contains the domain (e.g., "name.cofoundy.dev")
#   3. CV in public/cv.pdf, guia in public/guia.pdf (optional)

name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
